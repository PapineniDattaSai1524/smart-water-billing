server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file route goes to index.html so React Router
    # (client-side routing) handles it instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
