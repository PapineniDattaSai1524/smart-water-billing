# ==============================
# Application
# ==============================
spring.application.name=smart-water-billing-system
# Defaults to 'dev' so local/demo runs are unaffected. Set SPRING_PROFILES_ACTIVE=prod
# in production -- this activates JwtSecretStartupValidator, which refuses to start
# if app.jwt.secret still equals the checked-in development value.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=8080
server.servlet.context-path=/

# ==============================
# PostgreSQL DataSource
# ==============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_water_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================
# Flyway
# ==============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==============================
# JWT
# ==============================
app.jwt.secret=${JWT_SECRET:404E635266546A576E5A7234753778214125442A472D4B6150645367566B59}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ==============================
# Swagger / OpenAPI
# ==============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==============================
# File Upload (CSV)
# ==============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==============================
# File Storage (profile photos)
# ==============================
app.upload-dir=${UPLOAD_DIR:uploads/photos}

# ==============================
# CORS (dev)
# ==============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==============================
# Forgot / Reset Password
# ==============================
# Base URL of the frontend, used to build the link emailed to the user
# (<frontend-url>/reset-password?token=...). Point this at the deployed
# frontend origin in staging/production.
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.token-expiry-minutes=${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:30}

# ==============================
# Alert & Notification Engine
# ==============================
app.alert.enabled=${ALERT_ENGINE_ENABLED:true}
app.alert.daily-threshold-kl=${ALERT_DAILY_THRESHOLD_KL:1.0}
app.alert.anomaly-std-dev-multiplier=${ALERT_ANOMALY_STD_DEV_MULTIPLIER:2.0}
app.alert.min-history-readings=${ALERT_MIN_HISTORY_READINGS:7}
# Default is every minute (demo/testing-friendly, so the scheduler visibly fires without
# waiting hours). Set ALERT_ENGINE_CRON=0 0 6 * * * (or another real schedule) for production.
app.alert.cron=${ALERT_ENGINE_CRON:0 * * * * *}
app.alert.email-enabled=${ALERT_EMAIL_ENABLED:true}

# ==============================
# Usage reading plausibility guardrails
# Rejects (does not clamp/hide) a single manual/CSV reading whose implied
# consumption is unrealistic for a residential household -- catches unit
# mix-ups (litres vs kL) and cumulative/serial numbers pasted in by mistake
# at entry time, before they reach the dashboard or billing engine.
# ==============================
app.usage-validation.enabled=${USAGE_VALIDATION_ENABLED:true}
app.usage-validation.max-single-reading-kl=${USAGE_MAX_SINGLE_READING_KL:500.0}
app.usage-validation.max-meter-reading-kl=${USAGE_MAX_METER_READING_KL:1000000.0}

# --- Email (SMTP) ---
# SECURITY: no credential defaults here. A previous version of this file had a live
# Gmail app-password hardcoded as the fallback default -- that is a real, working
# credential baked into source control and every copy of this project's zip.
# ACTION REQUIRED: that app password must be revoked/rotated immediately at
# https://myaccount.google.com/apppasswords, since it has already been exposed.
# Provide real values via environment variables only (e.g. a local .env file that is
# git-ignored, or your deployment platform's secrets manager) -- never commit them here.
# If MAIL_USERNAME/MAIL_PASSWORD are unset, Spring Mail's autoconfiguration is simply
# not usable and NotificationService's isEmailConfigured()-style checks (see below)
# should surface a clear "email not configured" state instead of failing silently.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
mail.from=${MAIL_FROM:no-reply@smartwaterbilling.local}

# ==============================
# Logging
# ==============================
logging.level.com.smartwater.billing=INFO
logging.level.org.springframework.security=INFO
